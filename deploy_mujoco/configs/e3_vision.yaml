# Vision deploy — paths use deploy_mujoco/paths.py tokens
policy_path: "{DEPLOY_DIR}/policy/motion_lstm.pt"
xml_path: "{PACKAGE_ROOT}/resources/robots/e3_21dof/scene_terrain.xml"
# Note: Make sure the XML file includes a depth camera named "depth_cam" in the pelvis_link body

# Total simulation time
simulation_duration: 600.0
# Simulation time step
simulation_dt: 0.002
# Controller update frequency (meets the requirement of simulation_dt * control_decimation=0.02; 50Hz)
control_decimation: 10

kps: [
      100, 80, 80, 100, 20, 20, 
      100, 80, 80, 100, 20, 20,
      100,
      20, 20, 20, 20,
      20, 20, 20, 20,
      ]
kds: [
      4, 2, 2, 4, 0.7, 0.7,
      4, 2, 2, 4, 0.7, 0.7,
      4,
      0.5, 0.5, 0.5, 0.5,
      0.5, 0.5, 0.5, 0.5,]

default_angles: [  
                  -0.10,  0.0,  0.0,  0.15, -0.0, 0.0, 
                  -0.10,  0.0,  0.0,  0.15, -0.0, 0.0,
                  0.0,
                  0.05,   0.1,  0.1,  0.9,
                  0.05,  -0.1, -0.1,  0.9,
                  ]

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [2.0, 2.0, 0.25]
num_actions: 21
num_obs: 72
include_phase_in_obs: False  # 是否在观测中包含相位（sin_phase, cos_phase）

cmd_init: [0., 0, 0]

# Depth Camera Configuration (from e3_21dof_amp_vision_config.py)
depth_size: [24, 32]  # [height, width] - matches config
depth_buffer_use_length: 2  # number of depth images to store and use (frames will be concatenated)
depth_decimation: 5  # update depth image every N control steps

# Depth camera position and orientation (from config)
depth_cam_position: [0.12, 0.0175, 0.25]  # [x, y, z] relative to pelvis
depth_cam_euler_deg: [0.0, 60.0, 0.0]  # [roll, pitch, yaw] in degrees
depth_cam_fovy: 79.3  # vertical field of view in degrees (approximate from HFOV=87deg)

# Depth image processing (from warp_vision.py)
depth_min_range: 0.2  # meters
depth_max_range: 2.0  # meters
depth_noise_amp: 0.00  # noise amplitude for depth images

# Gamepad configuration
gamepad_type: logitech  # logitech or betop

